<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log In — Raasta</title>
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/auth.css" />
</head>
<body>

<main>
  <section class="auth-page">
    <div class="auth-card">

      <div class="auth-brand">
        <div class="brand-mark">R</div>
        <span class="auth-brand-name">Raasta</span>
      </div>

      <div class="auth-heading">
        <h1 data-i18n="auth.titleLogin">Welcome back</h1>
      </div>
      <p class="auth-sub" data-i18n="auth.subLogin">Apna career ka raasta continue karo.</p>

      <div class="auth-alert" id="auth-alert" role="alert" aria-live="polite"></div>

      <form class="auth-form" id="login-form" novalidate>

        <div class="auth-field">
          <label for="email"><span data-i18n="auth.emailLabel">Email</span> <span class="req">*</span></label>
          <input class="auth-input" id="email" type="email" data-i18n-placeholder="auth.emailPh" placeholder="tumhara@email.com" autocomplete="email" />
          <span class="field-error" id="email-error"></span>
        </div>

        <div class="auth-field">
          <label for="password"><span data-i18n="auth.passLabel">Password</span> <span class="req">*</span></label>
          <div class="password-wrap">
            <input class="auth-input" id="password" type="password" data-i18n-placeholder="auth.passPhLogin" placeholder="••••••••" autocomplete="current-password" />
            <button type="button" class="toggle-pass" data-target="password" aria-label="Show password"></button>
          </div>
          <span class="field-error" id="password-error"></span>
        </div>

        <button type="submit" class="auth-submit" data-i18n="auth.loginBtn">Log In</button>
      </form>

      <p class="auth-switch"><span data-i18n="auth.switchLoginPre">Naya ho?</span> <a href="signup.html"><span data-i18n="auth.switchLoginLink">Sign up karo</span></a></p>
      <p class="auth-back"><a href="index.html" data-i18n="auth.back">&larr; Home pe wapas</a></p>

      <div class="auth-demo" data-i18n="auth.demoLogin">
        Demo tip: pehle signup karke account banao — data browser ke
        localStorage mein store hota hai, koi backend nahi.
      </div>

    </div>
  </section>
</main>

<script src="js/data.js"></script>
<script src="js/i18n.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
